name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax
        run: for file in aptup install.sh tests/smoke.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck aptup install.sh tests/smoke.sh
      - name: Mocked smoke tests
        run: bash tests/smoke.sh
