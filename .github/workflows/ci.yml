name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax
        run: bash -n aptup && bash -n install.sh
      - name: ShellCheck
        run: shellcheck aptup install.sh
      - name: Mocked tests (no system package changes)
        run: python3 -m unittest discover -s tests -v
